# Drop-in for kodi.service: install as
# /storage/.config/system.d/kodi.service.d/jellyfin-location.conf
# Before every Kodi start, point Jellyfin/Seerr at the LAN (home) or the
# public URL (away). "-" = a failure never stops Kodi from starting.
[Service]
ExecStartPre=-/usr/bin/python3 /storage/kodi-config/jellyfin-location/jf_location.py auto
